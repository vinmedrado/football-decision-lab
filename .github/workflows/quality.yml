name: Quality and portfolio build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -r requirements.txt -r web_dashboard_lux/requirements.txt
      - name: Compile Python source
        run: python -m compileall -q 01_scripts 02_validation 03_backtest 04_ml core tests scripts web_dashboard_lux
      - name: Regression tests (no provider credentials)
        run: python -m pytest tests -q
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build static portfolio
        run: npm run build
